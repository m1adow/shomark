services:
  worker:
    build: ../../../worker
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      # Kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=video-processing
      - KAFKA_COMPLETION_TOPIC=video-processing-completed
      - KAFKA_TRANSCRIPTION_TOPIC=video-transcription
      - KAFKA_SUMMARIZATION_TOPIC=video-summarization-completed
      - KAFKA_GROUP_ID=worker-group
      - KAFKA_MAX_POLL_INTERVAL_MS=1800000   # 30 minutes — enough for long videos
      - KAFKA_SESSION_TIMEOUT_MS=60000        # 60 seconds heartbeat timeout
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-password123}
      # Ollama
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_SUMMARY_MODEL=qwen3.5:0.8b
      - OLLAMA_TIMEOUT=300
      - OLLAMA_NUM_PREDICT=1024
      # Whisper GPU
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_BATCH_SIZE=16
      # Transcript cache (MinIO)
      - CACHE_BUCKET=cache
      - CACHE_ENABLED=true
    volumes:
      # Map the current directory on your host to /app in the container
      - ../../../worker:/app
    # Optional: If you have an NVIDIA GPU, uncomment the lines below to make Whisper 10x faster
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]